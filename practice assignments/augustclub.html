<!DOCTYPE html>
<html>
<head>
<title>August Club Sign Up</title>
</head>
<body>
<h1>August Club</h1>
<p>Celebrate the month of August with us!</p>
<form>
  <label>Name:</label>
  <input type="text" name="name"><br><br>

  <label>Email:</label>
  <input type="email" name="email"><br><br>

  <label>Favorite August Activity:</label>
  <input type="text" name="activity"><br><br>

  <label>Birthday in August?</label>
  <input type="checkbox" name="birthday"><br><br>

  <input type="submit" value="Join">
</form>
</body>
</html>
